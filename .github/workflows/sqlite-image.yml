name: sqlite-image

on:
  push:
    branches:
      - feat/sqlite-storage-adapter
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64 runner (free for public repos). QEMU emulation of the
    # better-sqlite3 native compile crashed with SIGILL (exit 132).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.docker
          platforms: linux/arm64
          push: true
          tags: ghcr.io/142bot/tmdb-discover-plus:sqlite-adapter
